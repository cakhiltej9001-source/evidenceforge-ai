services:
  evidenceforge:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      EVIDENCEFORGE_MODEL_PROVIDER: fixture
      EVIDENCEFORGE_DATA_DIR: /data
      EVIDENCEFORGE_TRACING_ENABLED: "false"
      PORT: "8501"
    volumes:
      - evidenceforge-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  evidenceforge-data:
