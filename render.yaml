# Reviewable single-owner service. Applying this creates paid resources.
# The Caddy gateway refuses hosted access until its bcrypt password hash is configured.
services:
  - type: web
    name: evidenceforge-demo
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /_stcore/health
    numInstances: 1
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    envVars:
      - key: EVIDENCEFORGE_AUTH_REQUIRED
        value: "true"
      - key: EVIDENCEFORGE_AUTH_PASSWORD_HASH
        sync: false
      - key: CADDY_AUTH_REQUIRED
        value: "true"
      - key: CADDY_AUTH_USERNAME
        value: admin
      - key: CADDY_AUTH_PASSWORD_HASH
        sync: false
      - key: PORT
        value: "8501"
      - key: EVIDENCEFORGE_DATA_DIR
        value: /data/evidenceforge
      - key: EVIDENCEFORGE_MODEL_PROVIDER
        value: fixture
      - key: EVIDENCEFORGE_TRACING_ENABLED
        value: "false"
    disk:
      name: evidenceforge-data
      mountPath: /data
      sizeGB: 1

